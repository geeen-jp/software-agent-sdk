---
name: Publish all OpenHands packages (uv)

# Manual only. Publishing to PyPI is not adopted for this fork by default: the
# job runs only when a person dispatches the workflow and types the exact
# confirmation `publish-pypi`; any other value skips the job. There is no
# release/push/pull_request trigger. The job fails closed when the
# PYPI_TOKEN_OPENHANDS secret is missing. See README-RELEASE.md.

on:
    workflow_dispatch:
        inputs:
            confirm:
                description: Type publish-pypi to publish to PyPI (anything else does nothing)
                required: true
                default: ''
                type: string

jobs:
    publish:
        if: inputs.confirm == 'publish-pypi'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Extract version from pyproject.toml
              id: extract_version
              run: |
                  VERSION=$(grep -m1 '^version = ' openhands-sdk/pyproject.toml | cut -d'"' -f2)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "📦 Version: $VERSION"

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: latest
                  python-version: '3.13'

            - name: Build and publish all packages
              env:
                  UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN_OPENHANDS }}
                  VERSION: ${{ steps.extract_version.outputs.version }}
              run: |
                  set -euo pipefail

                  if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
                    echo "❌ Missing secret PYPI_TOKEN_OPENHANDS"
                    exit 1
                  fi

                  PACKAGES=(
                    openhands-sdk
                    openhands-tools
                    openhands-workspace
                    openhands-agent-server
                  )

                  expected_version="${VERSION}"
                  actual_version=$(python3 -c \
                    'import json; print(json.load(open("clients/typescript/package.json"))["version"])')
                  if [ "$actual_version" != "$expected_version" ]; then
                    echo "❌ TypeScript client version $actual_version does not match release version $expected_version"
                    exit 1
                  fi

                  echo "🚀 Building and publishing all packages..."
                  for PKG in "${PACKAGES[@]}"; do
                    echo "===== $PKG ====="
                    uv build --package "$PKG"
                  done

                  # Use --check-url to skip files that already exist on PyPI
                  # This allows re-running the workflow after partial failures
                  uv publish --token "$UV_PUBLISH_TOKEN" --check-url https://pypi.org/simple/
                  echo "✅ All packages built and published successfully!"
