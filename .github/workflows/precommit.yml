---
# .github/workflows/precommit.yml
# On pull requests `make validate` (workflow Validate) already runs the same
# `pre-commit run --all-files --show-diff-on-failure`, so this workflow no
# longer triggers on pull_request. It remains for pushes to main, the only run
# of the hook outside `make validate`, and can be started manually.
name: Pre-commit checks

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    pre-commit:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

            - name: Install dependencies
              run: uv sync --frozen --group dev

            - name: Run pre-commit (all files)
              run: uv run pre-commit run --all-files --show-diff-on-failure
