---
# .github/workflows/validate.yml
# Job name `validate` is the check name the ai-dev merge coordinator looks for.
name: Validate

on:
    pull_request:
        branches: ['**']

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 31
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  enable-cache: true
                  python-version: '3.13'

            - name: Run make validate
              run: make validate
