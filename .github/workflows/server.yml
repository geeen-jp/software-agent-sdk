---
name: Agent Server

on:
    push:
        branches: [main]
        tags:
            - '*'  # Trigger on any tag (e.g., 1.0.0, 1.0.0a5, build-docker)
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            base_image:
                description: Base runtime image
                type: string
                default: nikolaik/python-nodejs:python3.13-nodejs22-slim
            image:
                description: GHCR image name (empty uses ghcr.io/<owner>/agent-server)
                type: string
                default: ''
            platforms:
                description: Target platforms
                type: string
                default: linux/amd64
            install_acp_providers:
                description: Comma-separated ACP provider keys to bake into the image
                type: string
                default: claude-code,codex,gemini-cli
            install_capabilities:
                description: Comma-separated capability keys to bake into the image
                type: string
                default: vscode,browser,docker
            publish:
                description: >-
                    After the smoke test passes, also apply the published GHCR
                    tags (sha, branch, latest-<variant>, release version) to
                    the verified digest. Default false keeps only the
                    run-scoped verification image.
                type: boolean
                default: false

permissions:
    contents: read
    packages: read

# CI scope: Ubuntu linux/amd64 only. Windows, macOS and linux/arm64 jobs were
# removed (sdk#82); the single-entry matrices below are kept so the existing
# check names (e.g. `build-binary-and-test (ubuntu-latest)`) do not change.
#
# Docker images are on-demand (sdk#83). push (main/tags) and pull_request run
# only the code/test/schema jobs (`build-binary-and-test`,
# `check-openapi-schema`); they build and push no GHCR image, for fork and
# same-repo PRs alike. One explicit `workflow_dispatch` runs the whole chain
# in this run, linked by `needs` and artifacts, with no cross-workflow wait:
#   build-and-push-image -> docker-smoke-test -> publish-images (publish=true)
#
# Verification image vs published image:
#   - Verification image: <image>:verify-<run_id>-<run_attempt>-<variant>,
#     pushed by build-and-push-image and smoke-tested by its digest. Unique per
#     run, never reused. It is not a release artifact; delete the GHCR package
#     versions manually when no longer needed (GitHub Actions does not expire
#     them; only the artifact carrying the digest expires after 1 day).
#   - Published image: the same digest re-tagged by publish-images
#     (<sha7>-<variant>, <long-sha>-<variant>, <branch>-<variant>,
#     <sha7>-<base-slug>, <X.Y.Z>-<variant> on a tag ref, and
#     latest-<variant> on main). These tags are mutable aliases and exist only
#     after an explicit dispatch with publish=true.
# Consumers of the old main/SHA/release tags keep working for images already
# pushed; no new tag moves unless someone dispatches with publish=true. The
# `*-amd64` suffixed tags are no longer pushed.

jobs:
    build-binary-and-test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: latest
                  python-version: '3.13'
            - name: Install dependencies
              run: uv sync --dev

            - name: Build binary
              run: make build-server

            - name: Test binary
              shell: bash
              run: |
                  set -euo pipefail

                  BIN=./dist/openhands-agent-server

                  "$BIN" --help

                  echo "Testing server startup and template loading..."
                  "$BIN" --port 8002 > server_test.log 2>&1 &
                  SERVER_PID=$!

                  sleep 5

                  if grep -q "system_prompt.j2.*not found" server_test.log; then
                      echo "ERROR: Template files not found in binary!"
                      cat server_test.log
                      kill "$SERVER_PID" 2>/dev/null || true
                      exit 1
                  fi

                  if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                      echo "ERROR: Server failed to start!"
                      cat server_test.log
                      exit 1
                  fi

                  if command -v curl >/dev/null 2>&1; then
                      echo "Testing basic API endpoint..."
                      if curl -f -s http://localhost:8002/health >/dev/null 2>&1; then
                          echo "✓ Health endpoint accessible"
                      else
                          echo "⚠ Health endpoint not accessible (may be expected)"
                      fi
                  fi

                  kill "$SERVER_PID" 2>/dev/null || true
                  wait "$SERVER_PID" 2>/dev/null || true
                  rm -f server_test.log

                  echo "✓ Binary test completed successfully"

            - name: Test --extra-python-path custom tool import
              shell: bash
              run: |
                  set -euo pipefail

                  BIN=./dist/openhands-agent-server

                  wait_for_log() {
                      local log_file=$1
                      local pattern=$2
                      local timeout_seconds=${3:-45}

                      for _ in $(seq 1 "$timeout_seconds"); do
                          if grep -q "$pattern" "$log_file"; then
                              return 0
                          fi
                          sleep 1
                      done
                      return 1
                  }

                  stop_process() {
                      local pid=$1
                      kill "$pid" 2>/dev/null || true
                      wait "$pid" 2>/dev/null || true
                  }

                  # Create a temporary directory with an external tool module
                  TOOL_DIR=$(mktemp -d)

                  cat > "$TOOL_DIR/ci_test_tool.py" << 'TOOL_EOF'
                  """CI smoke-test tool: NOT bundled in the binary.

                  Importing this module proves that --extra-python-path /
                  OH_EXTRA_PYTHON_PATH correctly extends sys.path at runtime
                  so external .py files are reachable from a frozen build.
                  """
                  CI_TOOL_LOADED = True
                  TOOL_EOF

                  echo "=== Negative test: import WITHOUT extra path (should fail) ==="
                  "$BIN" --import-modules ci_test_tool --port 8003 \
                      > neg_test.log 2>&1 &
                  NEG_PID=$!

                  if wait_for_log neg_test.log "No module named 'ci_test_tool'"; then
                      echo "✓ Negative test passed: import correctly failed without --extra-python-path"
                  else
                      echo "ERROR: Expected ModuleNotFoundError but got:"
                      cat neg_test.log
                      stop_process "$NEG_PID"
                      rm -rf "$TOOL_DIR" neg_test.log
                      exit 1
                  fi
                  stop_process "$NEG_PID"
                  rm -f neg_test.log

                  echo "=== Positive test: import WITH OH_EXTRA_PYTHON_PATH ==="
                  OH_EXTRA_PYTHON_PATH="$TOOL_DIR" \
                      "$BIN" --import-modules ci_test_tool --port 8004 \
                      > pos_test.log 2>&1 &
                  POS_PID=$!

                  if wait_for_log pos_test.log "Imported module: ci_test_tool"; then
                      echo "✓ Positive test passed: external module imported via OH_EXTRA_PYTHON_PATH"
                  else
                      echo "ERROR: Module was not imported. Server log:"
                      cat pos_test.log
                      stop_process "$POS_PID"
                      rm -rf "$TOOL_DIR" pos_test.log
                      exit 1
                  fi

                  if grep -q "Added to sys.path:" pos_test.log; then
                      echo "✓ sys.path was extended with the tool directory"
                  else
                      echo "ERROR: sys.path was not extended. Server log:"
                      cat pos_test.log
                      stop_process "$POS_PID"
                      rm -rf "$TOOL_DIR" pos_test.log
                      exit 1
                  fi

                  stop_process "$POS_PID"

                  echo "=== Positive test: import WITH --extra-python-path CLI flag ==="
                  "$BIN" --extra-python-path "$TOOL_DIR" \
                      --import-modules ci_test_tool --port 8005 \
                      > cli_test.log 2>&1 &
                  CLI_PID=$!

                  if wait_for_log cli_test.log "Imported module: ci_test_tool"; then
                      echo "✓ CLI flag test passed: external module imported via --extra-python-path"
                  else
                      echo "ERROR: Module was not imported via CLI flag. Server log:"
                      cat cli_test.log
                      stop_process "$CLI_PID"
                      rm -rf "$TOOL_DIR" cli_test.log pos_test.log
                      exit 1
                  fi

                  stop_process "$CLI_PID"

                  # Cleanup
                  rm -rf "$TOOL_DIR" pos_test.log neg_test.log cli_test.log

                  echo "✓ All --extra-python-path tests passed"

            - name: Upload binary artifact
              uses: actions/upload-artifact@v7
              with:
                  name: openhands-server-${{ matrix.os }}
                  path: |
                      dist/openhands-agent-server*
                  retention-days: 7

    check-openapi-schema:
        name: Check OpenAPI Schema
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: latest
                  python-version: '3.13'

            - name: Install Node.js (for npx)
              uses: actions/setup-node@v6
              with:
                  node-version: 22


            - name: Install dependencies
              run: |
                  uv sync --frozen --dev

            - name: Check OpenAPI JSON and build client
              env:
                  PYTHONPATH: .
              run: |
                  make test-server-schema

    build-and-push-image:
        name: Build & Push (${{ matrix.variant }}-${{ matrix.arch }})
        # Explicit workflow_dispatch only. push, tag and pull_request events
        # (fork or same-repo) never build or push a GHCR image.
        if: github.event_name == 'workflow_dispatch'
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                # Explicit matrix: 3 variants x linux/amd64 = 3 jobs
                include:
                    - variant: python
                      arch: amd64
                      base_image: nikolaik/python-nodejs:python3.13-nodejs22-slim
                      runner: ubuntu-24.04
                      platform: linux/amd64

                    - variant: java
                      arch: amd64
                      base_image: eclipse-temurin:17-jdk
                      runner: ubuntu-24.04
                      platform: linux/amd64

                    - variant: golang
                      arch: amd64
                      base_image: golang:1.21-bookworm
                      runner: ubuntu-24.04
                      platform: linux/amd64

        runs-on: ${{ matrix.runner }}

        env:
            # Push to this repo's GHCR namespace. Hardcoding openhands/ fails on
            # forks (permission_denied: The requested installation does not exist).
            IMAGE: ${{ inputs.image != '' && inputs.image || format('ghcr.io/{0}/agent-server', github.repository_owner) }}
            BASE_IMAGE: ${{ inputs.base_image != '' && inputs.base_image || matrix.base_image }}
            # The maybe-empty value (inputs.install_acp_providers) must be the
            # LAST operand: GitHub Actions' `A && B || C` collapses to C
            # whenever B is falsy, so an explicit "" dispatch input ("install
            # none") would silently fall through to the default if it sat in
            # B's position instead.
            INSTALL_ACP_PROVIDERS: ${{ github.event_name != 'workflow_dispatch' && 'claude-code,codex,gemini-cli' || inputs.install_acp_providers }}
            # Same last-operand reasoning as INSTALL_ACP_PROVIDERS above: an
            # explicit "" dispatch input ("install none") must survive.
            INSTALL_CAPABILITIES: ${{ github.event_name != 'workflow_dispatch' && 'vscode,browser,docker' || inputs.install_capabilities }}
            CUSTOM_TAGS: ${{ matrix.variant }}
            VARIANT: ${{ matrix.variant }}
            ARCH: ${{ matrix.arch }}
            TARGET: binary
            PLATFORM: ${{ matrix.platform }}
            SDK_SHA: ${{ github.sha }}
            SDK_REF: ${{ github.ref }}
            # Verification tag: unique per run and attempt, so concurrent
            # dispatches never share or overwrite it. It is the only tag this
            # job pushes; the smoke job pulls the digest, not the tag.
            VERIFY_TAG: verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}
            CI: 'true'

        steps:
            - name: Lowercase GHCR image
              run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

            - name: Checkout
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  version: latest
                  python-version: '3.13'

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

            - name: Log in to GHCR
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare build context and metadata
              id: prep
              env:
                  GITHUB_REF: ${{ github.ref }}
              run: |
                  uv sync --frozen

                  # `--arch ""` makes build.py emit the final arch-less tags
                  # (e.g. <sha7>-python); they are applied by publish-images
                  # only, never by this job.
                  BUILD_CMD="uv run ./openhands-agent-server/openhands/agent_server/docker/build.py --build-ctx-only --arch ''"
                  if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                      BUILD_CMD="$BUILD_CMD --versioned-tag"
                  fi
                  eval "$BUILD_CMD"

                  PUBLISH_TAGS=$(grep '^tags_csv=' "$GITHUB_OUTPUT" | cut -d= -f2-)
                  echo "publish_tags=$PUBLISH_TAGS" >> "$GITHUB_OUTPUT"

                  echo "=== Build outputs ==="
                  echo "Build context: $(grep '^build_context=' "$GITHUB_OUTPUT" | cut -d= -f2-)"
                  echo "Verification tag: ${IMAGE}:${VERIFY_TAG}"
                  echo "Tags applied only by publish-images: $PUBLISH_TAGS"
                  echo "===================="

            - name: Build & Push (${{ matrix.variant }}-${{ matrix.arch }})
              id: build
              uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
              with:
                  context: ${{ steps.prep.outputs.build_context }}
                  file: ${{ steps.prep.outputs.dockerfile }}
                  target: ${{ env.TARGET }}
                  platforms: ${{ env.PLATFORM }}
                  push: true
                  tags: ${{ env.IMAGE }}:${{ env.VERIFY_TAG }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      BASE_IMAGE=${{ env.BASE_IMAGE }}
                      OPENHANDS_BUILD_GIT_SHA=${{ env.SDK_SHA }}
                      OPENHANDS_BUILD_GIT_REF=${{ env.SDK_REF }}
                      INSTALL_ACP_PROVIDERS=${{ env.INSTALL_ACP_PROVIDERS }}
                      INSTALL_CAPABILITIES=${{ env.INSTALL_CAPABILITIES }}

            - name: Cleanup build context
              if: always()
              env:
                  BUILD_CONTEXT: ${{ steps.prep.outputs.build_context }}
              run: |
                  if [ -n "$BUILD_CONTEXT" ] && [ -d "$BUILD_CONTEXT" ]; then
                      echo "Cleaning up build context: $BUILD_CONTEXT"
                      rm -rf "$BUILD_CONTEXT"
                  fi

            - name: Record verified image reference
              env:
                  BUILD_DIGEST: ${{ steps.build.outputs.digest }}
                  PUBLISH_TAGS: ${{ steps.prep.outputs.publish_tags }}
              run: |
                  set -euo pipefail
                  if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                      echo "ERROR: build produced no valid image digest: '$BUILD_DIGEST'"
                      exit 1
                  fi
                  mkdir -p image-ref
                  jq -n \
                    --arg variant "$VARIANT" \
                    --arg image "$IMAGE" \
                    --arg verify_tag "$VERIFY_TAG" \
                    --arg digest "$BUILD_DIGEST" \
                    --arg publish_tags "$PUBLISH_TAGS" \
                    '{
                      variant: $variant,
                      image: $image,
                      verify_tag: $verify_tag,
                      digest: $digest,
                      publish_tags: $publish_tags
                    }' > "image-ref/${VARIANT}.json"
                  echo "Image: ${IMAGE}@${BUILD_DIGEST} (tag ${VERIFY_TAG})"

            - name: Upload image reference artifact
              uses: actions/upload-artifact@v7
              with:
                  name: image-ref-${{ matrix.variant }}
                  path: image-ref/${{ matrix.variant }}.json
                  retention-days: 1
                  if-no-files-found: error

    docker-smoke-test:
        name: Docker smoke (${{ matrix.variant }}-${{ matrix.arch }})
        # Skipped automatically when build-and-push-image is skipped, i.e. on
        # every event other than workflow_dispatch. Not a required check.
        needs: build-and-push-image
        permissions:
            contents: read
            packages: read
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - variant: python
                      arch: amd64
                      runner: ubuntu-24.04
                    - variant: java
                      arch: amd64
                      runner: ubuntu-24.04
                    - variant: golang
                      arch: amd64
                      runner: ubuntu-24.04
        env:
            VARIANT: ${{ matrix.variant }}
            ARCH: ${{ matrix.arch }}
        steps:
            - name: Download image reference
              uses: actions/download-artifact@v8
              with:
                  name: image-ref-${{ matrix.variant }}
                  path: image-ref

            - name: Log in to GHCR
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull the built digest (fails immediately if absent)
              shell: bash
              run: |
                  set -euo pipefail
                  IMAGE=$(jq -r '.image' "image-ref/${VARIANT}.json")
                  DIGEST=$(jq -r '.digest' "image-ref/${VARIANT}.json")
                  VERIFY_TAG=$(jq -r '.verify_tag' "image-ref/${VARIANT}.json")
                  {
                      echo "REF=${IMAGE}@${DIGEST}"
                      echo "DIGEST=${DIGEST}"
                      echo "TAG_REF=${IMAGE}:${VERIFY_TAG}"
                  } >> "$GITHUB_ENV"

                  echo "Pulling ${IMAGE}@${DIGEST} for linux/${ARCH} ..."
                  docker pull --platform="linux/${ARCH}" "${IMAGE}@${DIGEST}"

            - name: Verify tag and digest match and image is linux/amd64
              shell: bash
              run: |
                  set -euo pipefail
                  TAG_DIGEST=$(docker buildx imagetools inspect "$TAG_REF" \
                      --format '{{.Manifest.Digest}}')
                  if [ "$TAG_DIGEST" != "$DIGEST" ]; then
                      echo "ERROR: $TAG_REF resolves to $TAG_DIGEST, expected $DIGEST"
                      exit 1
                  fi
                  PLATFORM=$(docker image inspect "$REF" \
                      --format '{{.Os}}/{{.Architecture}}')
                  if [ "$PLATFORM" != "linux/${ARCH}" ]; then
                      echo "ERROR: $REF is $PLATFORM, expected linux/${ARCH}"
                      exit 1
                  fi
                  echo "✓ $TAG_REF == $DIGEST ($PLATFORM)"

            - name: Run container and check /health
              shell: bash
              run: |
                  set -euo pipefail
                  CONTAINER="agent-server-smoke-${VARIANT}-${ARCH}"

                  docker run --platform="linux/${ARCH}" -d --rm \
                      --name "$CONTAINER" \
                      -p 127.0.0.1:8000:8000 \
                      "$REF" --host 0.0.0.0

                  cleanup() {
                      docker logs "$CONTAINER" 2>&1 | tail -100 || true
                      docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT

                  for i in $(seq 1 40); do
                      if curl -f -s http://localhost:8000/health >/dev/null 2>&1; then
                          echo "✓ /health responded for $REF"
                          exit 0
                      fi
                      sleep 3
                  done

                  echo "ERROR: /health never responded for $REF"
                  exit 1

    publish-images:
        name: Publish GHCR tags (${{ matrix.variant }})
        # Opt-in: only when the dispatch sets publish=true. Runs after every
        # smoke leg passed (needs on a matrix job waits for all legs). Retags
        # the already-verified digest with `imagetools create`, so published
        # tags point at exactly the image that passed /health. A single-arch
        # (linux/amd64) manifest step is kept here because existing consumers
        # pull the arch-less tags (<sha7>-<variant>, <branch>-<variant>,
        # latest-<variant>, <X.Y.Z>-<variant>).
        needs: [build-and-push-image, docker-smoke-test]
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-24.04
        # Published tags such as <branch>-<variant> are mutable aliases;
        # serialize publishes per ref and variant so they cannot interleave.
        concurrency:
            group: agent-server-publish-${{ github.ref }}-${{ matrix.variant }}
            cancel-in-progress: false
        strategy:
            fail-fast: false
            matrix:
                variant: [python, java, golang]
        steps:
            - name: Download image reference
              uses: actions/download-artifact@v8
              with:
                  name: image-ref-${{ matrix.variant }}
                  path: image-ref

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

            - name: Log in to GHCR
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Apply published tags to the verified digest
              shell: bash
              env:
                  GIT_REF: ${{ github.ref }}
                  VARIANT: ${{ matrix.variant }}
              run: |
                  set -euo pipefail
                  IMAGE=$(jq -r '.image' "image-ref/${VARIANT}.json")
                  DIGEST=$(jq -r '.digest' "image-ref/${VARIANT}.json")
                  PUBLISH_TAGS=$(jq -r '.publish_tags' "image-ref/${VARIANT}.json")

                  TAG_ARGS=()
                  IFS=',' read -ra TAGS <<< "$PUBLISH_TAGS"
                  for TAG in "${TAGS[@]}"; do
                      if [ -n "$TAG" ]; then
                          TAG_ARGS+=(-t "$TAG")
                      fi
                  done
                  # Preserve the latest-<variant> alias used by the workspace defaults.
                  if [ "$GIT_REF" == "refs/heads/main" ]; then
                      TAG_ARGS+=(-t "${IMAGE}:latest-${VARIANT}")
                  fi
                  if [ "${#TAG_ARGS[@]}" -eq 0 ]; then
                      echo "ERROR: no tags to publish for ${VARIANT}"
                      exit 1
                  fi

                  docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGE}@${DIGEST}"
                  docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
                  echo "✓ Published ${IMAGE}@${DIGEST} as: ${PUBLISH_TAGS}"
