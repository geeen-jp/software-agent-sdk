---
name: PR Description Check

# Read-only check of the PR template sections and the linked-issue reference.
# It uses plain pull_request (no secrets, read-only token on fork PRs) and
# deliberately passes no GITHUB_TOKEN to the script, so the `ready-for-dev`
# label lookup is skipped: this fork has no issue-readiness workflow that
# applies that label. See README-RELEASE.md.

on:
    pull_request:
        types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
    contents: read
    pull-requests: read

jobs:
    validate-pr-description:
        name: Validate PR description
        # Draft PRs may still have incomplete descriptions; validate when review starts.
        # Release PRs (`rel-*` branches) do not use the standard PR template.
        if: >-
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'rel-'))
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Validate PR template and linked-issue reference
              run: python .github/scripts/check_pr_description.py
