---
name: Publish TypeScript client to GitHub Packages

# Manual only. Publishing to GitHub Packages is not adopted for this fork by
# default: the job runs only when a person dispatches the workflow and types
# the exact confirmation `publish-github-packages`; any other value skips the
# job. There is no release/push/pull_request trigger. See README-RELEASE.md.

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version to publish without a leading v
                required: true
                type: string
            confirm:
                description: >-
                    Type publish-github-packages to publish to GitHub Packages
                    (anything else does nothing)
                required: true
                default: ''
                type: string

permissions:
    contents: read
    packages: write

defaults:
    run:
        working-directory: clients/typescript

jobs:
    publish:
        if: inputs.confirm == 'publish-github-packages'
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js for GitHub Packages
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json
                  registry-url: https://npm.pkg.github.com
                  scope: '@openhands'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Set package version
              env:
                  TARGET_VERSION: ${{ inputs.version }}
              run: npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version

            - name: Build package
              run: npm run build

            - name: Publish to GitHub Packages
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
