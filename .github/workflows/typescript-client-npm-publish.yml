---
name: Publish TypeScript client to npm

# Manual only. Publishing to npm is not adopted for this fork by default: the
# job runs only when a person dispatches the workflow and types the exact
# confirmation `publish-npm`; any other value skips the job. There is no
# release/push/pull_request trigger. See README-RELEASE.md.

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version to publish without a leading v
                required: true
                type: string
            confirm:
                description: Type publish-npm to publish to npm (anything else does nothing)
                required: true
                default: ''
                type: string

concurrency:
    group: typescript-client-npm-publish-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

defaults:
    run:
        working-directory: clients/typescript

jobs:
    publish:
        if: inputs.confirm == 'publish-npm'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js for npm trusted publishing
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json
                  registry-url: https://registry.npmjs.org

            - name: Upgrade npm for trusted publishing
              run: npm install -g npm@latest

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Set package version
              env:
                  TARGET_VERSION: ${{ inputs.version }}
              run: npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version

            - name: Build package
              run: npm run build

            - name: Verify package contents
              run: npm pack --dry-run

            - name: Publish to npm
              run: npm publish --access public --provenance --tag latest
